# Nixpacks config (Railway, and anyone running `nixpacks build .`).
#
# This repo has no package.json and no JavaScript, so a Node image can only
# crash-loop on `python bot.py`. Pinning the Python provider + start command
# removes the guesswork entirely.
#
# On Railway you can also set it in the UI:
#   Settings → Build → Builder = NIXPACKS (or DOCKERFILE, which is even safer)
#   Settings → Deploy → Start Command = python bot.py

[variables]
NIXPACKS_PYTHON_VERSION = "3.12"

[start]
cmd = "python bot.py"
